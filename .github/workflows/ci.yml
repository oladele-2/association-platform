name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: association
          POSTGRES_PASSWORD: association
          POSTGRES_DB: association_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U association -d association_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://association:association@localhost:5432/association_platform?schema=public
      DATABASE_URL_UNPOOLED: postgresql://association:association@localhost:5432/association_platform?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-16
      JWT_REFRESH_SECRET: ci-refresh-secret-min-16
      APP_PUBLIC_URL: http://localhost:3000
      CI: 'true'
      SKIP_DB_SMOKE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Prisma validate
        run: pnpm --filter @association/database prisma:validate
